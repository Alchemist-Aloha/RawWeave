[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/image",
  "crates/rendering",
  "crates/node-api",
  "crates/graph",
  "crates/project",
  "crates/raw",
  "crates/color",
  "crates/batch",
  "crates/external-protocol",
  "crates/external-host",
  "crates/ai-provider",
  "node-packs/ai",
  "node-packs/core-values",
  "node-packs/core-image",
  "node-packs/raw",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
rawweave-core = { path = "crates/core" }
rawweave-image = { path = "crates/image" }
rawweave-rendering = { path = "crates/rendering" }
rawweave-node-api = { path = "crates/node-api" }
rawweave-graph = { path = "crates/graph" }
rawweave-project = { path = "crates/project" }
rawweave-raw = { path = "crates/raw" }
rawweave-color = { path = "crates/color" }
rawweave-batch = { path = "crates/batch" }
rawweave-external-protocol = { path = "crates/external-protocol" }
rawweave-external-host = { path = "crates/external-host" }
rawweave-ai-nodes = { path = "node-packs/ai" }
rawweave-core-values = { path = "node-packs/core-values" }
rawweave-core-image = { path = "node-packs/core-image" }
rawweave-raw-nodes = { path = "node-packs/raw" }
