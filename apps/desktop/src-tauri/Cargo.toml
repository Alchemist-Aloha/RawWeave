[package]
name = "rawweave-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
rawweave-image = { path = "../../../crates/image" }
rawweave-node-api = { path = "../../../crates/node-api" }
rawweave-project = { path = "../../../crates/project" }
rawweave-rendering = { path = "../../../crates/rendering" }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2" }

[workspace]
