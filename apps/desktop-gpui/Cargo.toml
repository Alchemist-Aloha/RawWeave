[package]
name = "rawweave-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["vendor/gpui-flow"]
resolver = "2"

[features]
default = ["native"]
native = ["dep:gpui-kit", "dep:gpui-flow", "dep:image", "dep:smallvec"]
ui-tests = ["native", "gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.7.1", optional = true }
gpui-flow = { path = "vendor/gpui-flow", optional = true }
image = { version = "0.25", default-features = false, optional = true }
smallvec = { version = "1", optional = true }
rawweave-project = { path = "../../crates/project" }
rawweave-graph = { path = "../../crates/graph" }
rawweave-core = { path = "../../crates/core" }
rawweave-image = { path = "../../crates/image" }
rawweave-node-api = { path = "../../crates/node-api" }
rawweave-raw = { path = "../../crates/raw" }
rawweave-color = { path = "../../crates/color" }
rawweave-batch = { path = "../../crates/batch" }
rawweave-rendering = { path = "../../crates/rendering" }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "rawweave-gpui"
path = "src/main.rs"
required-features = ["native"]

[profile.dev]
debug = 0
